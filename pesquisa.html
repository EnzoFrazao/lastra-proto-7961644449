<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lastra — Pesquisa anônima (F01–F08) · protótipo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/ui.css">
<style>
  body { background:var(--bg-surface); min-height:100vh; }
  .top { max-width:1240px; margin:0 auto; padding:28px 24px 8px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .top p { color:var(--fg-2); font-size:14px; max-width:60ch; }
  .wrap { max-width:1240px; margin:0 auto; padding:16px 24px 64px; }
  .one { display:grid; grid-template-columns:260px 390px minmax(0,1fr); gap:40px; align-items:start; justify-content:center; }
  .steps-l { display:grid; gap:4px; position:sticky; top:24px; } .steps-l button { text-align:left; border:0; background:transparent; padding:10px 14px; border-radius:var(--r-md); font-size:14px; display:grid; gap:2px; } .steps-l button:hover { background:var(--bg-card); } .steps-l button[aria-pressed=true] { background:var(--bg-card); box-shadow:var(--shadow); font-weight:600; } .steps-l small { color:var(--fg-2); font-size:12px; font-weight:400; }
  .notes { position:sticky; top:24px; display:grid; gap:14px; } .notes .card { padding:18px; }
  .all { display:flex; flex-wrap:wrap; gap:40px 32px; justify-content:center; }
  .cap { text-align:center; margin-bottom:12px; color:var(--fg-2); font-size:14px; } .cap b { color:var(--fg); }
  .phone { width:390px; height:812px; background:var(--bg-page); border-radius:36px; border:1px solid var(--line); box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; position:relative; }
  .screen { flex:1; overflow:auto; display:flex; flex-direction:column; padding:28px 24px 24px; }
  .bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; min-height:28px; }
  .org { font-size:13px; font-weight:600; color:var(--fg-2); display:flex; align-items:center; gap:8px; } .org i { width:28px; height:28px; border-radius:50%; background:var(--bg-surface-strong); display:grid; place-items:center; font-style:normal; font-size:11px; font-weight:700; color:var(--fg); }
  .hero-ill { height:132px; border-radius:var(--r-md); background:var(--strata-1); position:relative; overflow:hidden; margin-bottom:26px; border:1px solid var(--line); } .hero-ill svg { position:absolute; inset:0; width:100%; height:100%; }
  h1.t { font-size:26px; line-height:1.2; font-weight:600; letter-spacing:-.01em; } h2.t { font-size:24px; line-height:1.25; font-weight:600; }
  .sub { margin-top:12px; color:var(--fg-2); font-size:15px; line-height:1.55; }
  .trust { list-style:none; padding:0; margin:22px 0 0; display:grid; gap:14px; } .trust li { display:grid; grid-template-columns:36px 1fr; gap:12px; align-items:start; font-size:14px; line-height:1.45; } .trust i { width:36px; height:36px; border-radius:50%; background:var(--tint); display:grid; place-items:center; } .trust svg.i { width:18px; height:18px; stroke-width:2; } .trust b { display:block; font-weight:600; }
  .spacer { flex:1; min-height:20px; }
  .btn.full { width:100%; padding:17px; font-size:17px; } .fine { margin-top:14px; font-size:12px; line-height:1.5; color:var(--fg-2); text-align:center; }
  .pslab { height:14px; background:var(--line); } .pslab i { display:block; height:100%; background:var(--fg); width:var(--p,0%); transition:width var(--t-slow) var(--ease); }
  .count { font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--fg-2); }
  .block { margin-top:24px; } .q { font-size:22px; line-height:1.3; font-weight:600; margin-top:10px; letter-spacing:-.005em; }
  .scale { display:grid; gap:10px; margin-top:22px; }
  .opt { display:flex; align-items:center; gap:14px; width:100%; text-align:left; min-height:54px; padding:11px 16px; border:1.5px solid var(--line); border-radius:var(--r-md); background:var(--bg-card); font-size:16px; font-weight:500; transition:border-color var(--t-fast), background var(--t-fast), transform var(--t-fast); }
  .opt:hover { border-color:var(--fg); } .opt:active { transform:scale(.99); } .opt .n { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--fg-2); display:grid; place-items:center; font-size:14px; font-weight:700; flex:none; }
  .opt[aria-checked="true"], .opt.on { border-color:var(--fg); background:var(--bg-surface-strong); } .opt[aria-checked="true"] .n { background:var(--fg); color:var(--bg-page); border-color:var(--fg); }
  .opt.sm { min-height:46px; font-size:15px; }
  .nav2 { display:grid; grid-template-columns:1fr 1.6fr; gap:12px; margin-top:22px; }
  .anon { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:16px; font-size:12px; color:var(--fg-2); } .anon svg.i { width:14px; height:14px; stroke-width:2; }
  .center { text-align:center; margin:auto 0; } .big { width:72px; height:72px; border-radius:50%; background:var(--tint); display:grid; place-items:center; margin:0 auto 20px; } .big svg.i { width:32px; height:32px; stroke-width:2.5; }
  .asm svg { height:84px; margin:0 auto 18px; display:block; overflow:visible; } .asm .p1, .asm .p2, .asm .p3 { transform-box:fill-box; animation:asm 700ms var(--ease-emph) both; } .asm .p1 { --x:-40px; --y:10px; } .asm .p2 { --x:0; --y:-40px; animation-delay:90ms; } .asm .p3 { --x:40px; --y:10px; animation-delay:180ms; }
  @keyframes asm { from { transform:translate(var(--x),var(--y)); opacity:0; } }
  .help { text-align:left; background:var(--bg-surface); border-radius:var(--r-md); padding:14px 16px; font-size:13px; line-height:1.5; margin-top:18px; } .help b { display:block; margin-bottom:2px; }
  textarea.ta { width:100%; min-height:150px; font:inherit; font-size:16px; padding:14px; border:1.5px solid var(--line); border-radius:var(--r-md); background:var(--bg-page); color:var(--fg); margin-top:18px; resize:none; line-height:1.5; }
  .warnbox { display:flex; gap:10px; align-items:flex-start; background:var(--alert-soft); color:var(--fg); border-radius:var(--r-md); padding:12px 14px; font-size:13px; line-height:1.45; margin-top:14px; } .warnbox svg.i { color:var(--alert); margin-top:1px; }
  .ck2 { display:flex; gap:12px; align-items:flex-start; padding:14px; border:1.5px solid var(--line); border-radius:var(--r-md); font-size:14px; line-height:1.45; margin-top:18px; } .ck2 input { width:22px; height:22px; accent-color:var(--fg); flex:none; margin:0; }
  .sumrow { display:flex; justify-content:space-between; gap:12px; padding:13px 0; border-top:1px solid var(--line); font-size:14px; } .sumrow:first-of-type { border-top:0; } .sumrow b { font-variant-numeric:tabular-nums; }
  @media (max-width:1100px) { .one { grid-template-columns:390px; justify-content:center; } .steps-l, .notes { position:static; } .steps-l { grid-auto-flow:column; grid-auto-columns:max-content; overflow-x:auto; } .notes { order:3; } }
  @media (max-width:520px) { .top { padding:16px; } .wrap { padding:0; } .one { grid-template-columns:1fr; gap:0; } .steps-l, .notes, .cap { display:none; } .phone { width:100%; height:calc(100vh - 0px); min-height:640px; border-radius:0; border:0; box-shadow:none; } .all { gap:0; } .all > div + div { display:none; } }
</style>
</head>
<body>
<div class="top">
  <div><span class="logo" data-logo="horizontal" style="height:26px"></span><p style="margin-top:8px">O que o colaborador vê, no celular. Sem login, sem nome. Dados de exemplo — nada é enviado.</p></div>
  <div class="seg" id="modo"><button data-v="um" aria-pressed="true">Fluxo interativo</button><button data-v="todas">Todas as telas</button></div>
</div>
<div class="wrap" id="root"></div>
<script src="assets/icons.js"></script><script src="assets/logo.js"></script>
<script>
  const QS = [['Demandas do trabalho', 'Tenho prazos tão curtos que preciso trabalhar além do horário para cumpri-los.'], ['Demandas do trabalho', 'O volume de trabalho me deixa sem tempo para fazer as tarefas com cuidado.'], ['Autonomia', 'Tenho liberdade para decidir como organizar o meu trabalho.'], ['Apoio da liderança', 'Posso contar com o apoio da minha chefia quando preciso.']];
  const OPTS = ['Nunca', 'Raramente', 'Às vezes', 'Frequentemente', 'Sempre'];
  const SETORES = ['Produção', 'Atendimento', 'Entrega', 'Administrativo', 'Prefiro não dizer'];
  const ILL = `<div class="hero-ill" aria-hidden="true"><svg viewBox="0 0 342 132" preserveAspectRatio="xMidYMid slice"><rect y="106" width="342" height="26" fill="var(--strata-3)"/><rect y="104" width="342" height="3" fill="var(--fg)"/><rect x="66" y="84" width="210" height="19" fill="var(--bg-deep)"/><rect x="96" y="63" width="150" height="19" fill="var(--bg-deep-surface)"/><rect x="126" y="42" width="90" height="19" fill="var(--neon)" stroke="var(--green)" stroke-width="1.5"/></svg></div>`;
  const ANON = `<p class="anon">${ic('shield')} Sua resposta é anônima</p>`;
  const bar = (right) => `<div class="bar"><span class="org"><i>SN</i>Padaria Sol Nascente</span>${right || ''}</div>`;
  const chrome = (inner, o = {}) => `<div class="screen">${inner}</div>`;
  const ans = {};
  const S = {
    f01: { t: 'Convite', h: () => `${bar('<span class="chip warn">exemplo</span>')}${ILL}<h1 class="t">A Padaria Sol Nascente quer ouvir como está o trabalho aqui.</h1><p class="sub">São cerca de 3 minutos e ninguém saberá quem respondeu.</p>
      <ul class="trust"><li><i>${ic('lock')}</i><div><b>Sua resposta é anônima</b>Não guardamos quem respondeu. Não há login nem nome.</div></li><li><i>${ic('group')}</i><div><b>Só aparecem grupos grandes</b>Resultados de grupos com menos de 5 pessoas nunca são mostrados.</div></li><li><i>${ic('pause')}</i><div><b>Você decide</b>Pode parar quando quiser. Responder é voluntário.</div></li></ul>
      <div class="spacer"></div><button class="btn btn-primary full" data-go="f02">Começar ${ic('arrow')}</button><p class="fine">Esta pesquisa não é um canal de denúncia. Para isso, use o canal da empresa.<br>Conduzida pela Lastra · seus dados seguem a LGPD.</p>` },
    f02: { t: 'Ciência e consentimento', h: () => `${bar()}<p class="label muted">Antes de começar</p><h2 class="t" style="margin-top:8px">O que acontece com as suas respostas</h2>
      <ul class="trust"><li><i>${ic('check')}</i><div><b>O que guardamos</b>Só as respostas, sem nome, sem telefone e sem identificação do aparelho.</div></li><li><i>${ic('x')}</i><div><b>O que não guardamos</b>Quem você é. Nem a empresa nem a Lastra conseguem descobrir.</div></li><li><i>${ic('chart')}</i><div><b>Para que serve</b>Entender onde o trabalho pesa e o que melhorar. Só viram números de grupos com 5 pessoas ou mais.</div></li></ul>
      <label class="ck2"><input type="checkbox" id="c2"> <span>Entendi e quero participar. Sei que é voluntário e que posso parar quando quiser.</span></label>
      <div class="spacer"></div><button class="btn btn-primary full" data-go="f03" id="b2" disabled>Continuar ${ic('arrow')}</button>${ANON}`,
      w: el => { const c = el.querySelector('#c2'), b = el.querySelector('#b2'); c.onchange = () => b.disabled = !c.checked; } },
    f03: { t: 'Perfil coletivo (opcional)', h: () => `${bar('<span class="count">Opcional</span>')}<h2 class="t">Em que setor você trabalha?</h2><p class="sub">Usamos só para agrupar os resultados por setor. Se o seu setor tiver menos de 5 pessoas, as respostas entram agrupadas com outro setor.</p>
      <div class="scale" id="sets">${SETORES.map(s => `<button class="opt sm" type="button">${s}</button>`).join('')}</div>
      <div class="warnbox">${ic('info')}<span>Quanto mais detalhes você der, mais fácil seria alguém deduzir quem respondeu. Por isso pedimos só o setor, e você pode pular.</span></div>
      <div class="spacer"></div><div class="nav2"><button class="btn btn-secondary" data-go="f04">Pular</button><button class="btn btn-primary" data-go="f04">Continuar ${ic('arrow')}</button></div>${ANON}`,
      w: el => el.querySelectorAll('#sets .opt').forEach(b => b.onclick = () => el.querySelectorAll('#sets .opt').forEach(x => x.classList.toggle('on', x === b))) },
    f04: { t: 'Pergunta (escala 1–5)', h: () => `${bar(`<span class="count" id="cnt"></span>`)}<div class="pslab" aria-hidden="true"><i id="hf"></i></div>
      <div class="block"><p class="label muted" id="bl"></p><h2 class="q" id="q"></h2><div class="scale" role="radiogroup" aria-labelledby="q" id="sc"></div></div>
      <div class="nav2"><button class="btn btn-secondary" id="bk" type="button">Voltar</button><button class="btn btn-primary" id="nx" type="button" disabled>Próxima ${ic('arrow')}</button></div><div class="spacer"></div>${ANON}`,
      w: (el, go) => { let i = 0; const $ = s => el.querySelector(s);
        function r() { $('#bl').textContent = QS[i][0]; $('#q').textContent = QS[i][1]; $('#cnt').textContent = `Pergunta ${i + 1} de ${QS.length}`;
          $('#sc').innerHTML = OPTS.map((o, k) => `<button class="opt" role="radio" aria-checked="${ans[i] === k + 1}" data-v="${k + 1}" type="button"><span class="n">${k + 1}</span>${o}</button>`).join('');
          $('#nx').disabled = !ans[i]; $('#bk').style.visibility = i === 0 ? 'hidden' : 'visible'; $('#nx').firstChild.textContent = i === QS.length - 1 ? 'Concluir ' : 'Próxima '; $('#hf').style.setProperty('--p', (i / QS.length * 100) + '%'); }
        $('#sc').onclick = e => { const b = e.target.closest('.opt'); if (!b) return; ans[i] = +b.dataset.v; [...$('#sc').children].forEach(c => c.setAttribute('aria-checked', c === b)); $('#nx').disabled = false; };
        $('#nx').onclick = () => { if (i < QS.length - 1) { i++; r(); } else go('f05'); }; $('#bk').onclick = () => { if (i > 0) { i--; r(); } }; r(); } },
    f05: { t: 'Pergunta aberta (opcional)', h: () => `${bar('<span class="count">Opcional</span>')}<div class="pslab" aria-hidden="true"><i style="--p:100%"></i></div><h2 class="t" style="margin-top:22px">Quer acrescentar alguma coisa?</h2><p class="sub">O que mais pesa no seu trabalho hoje, ou o que ajudaria? Pode deixar em branco.</p>
      <textarea class="ta" placeholder="Escreva com suas palavras…" aria-label="Comentário opcional"></textarea>
      <div class="warnbox">${ic('warn')}<span><b>Não cite nomes de pessoas.</b> Isto não é um canal de denúncia. Para denunciar algo grave, use o canal da empresa (indicado no cartaz).</span></div>
      <div class="spacer"></div><div class="nav2"><button class="btn btn-secondary" data-go="f06">Pular</button><button class="btn btn-primary" data-go="f06">Continuar ${ic('arrow')}</button></div>${ANON}` },
    f06: { t: 'Revisar e enviar', h: () => `${bar()}<h2 class="t">Tudo certo para enviar?</h2><p class="sub">Depois de enviar, não dá para alterar — e ninguém consegue ver que foi você.</p>
      <div style="margin-top:20px"><div class="sumrow"><span>Perguntas respondidas</span><b>4 de 4</b></div><div class="sumrow"><span>Setor</span><b>Informado</b></div><div class="sumrow"><span>Comentário</span><b>Sem comentário</b></div></div>
      <div class="spacer"></div><div class="nav2"><button class="btn btn-secondary" data-go="f04">Revisar</button><button class="btn btn-primary" data-go="f07">Enviar ${ic('send')}</button></div>${ANON}` },
    f07: { t: 'Obrigado', h: () => `<div class="center"><div class="asm"><span class="logo" data-logo="simbolo" style="height:84px;display:block;margin:0 auto 18px"></span></div><h2 class="t">Obrigado por responder.</h2><p class="sub">Sua resposta foi registrada sem nome e sem identificação. Os resultados chegam à empresa só por grupos de 5 pessoas ou mais.</p>
      <div class="help"><b>Se o trabalho está pesando em você</b>Conversar ajuda. O CVV atende 24 horas, de graça, pelo 188. Procure também um serviço de saúde. <span class="caption muted">(Texto a validar com o psicólogo parceiro.)</span></div>
      <p class="fine" style="margin-top:20px">Você já pode fechar esta página.</p></div><div class="spacer"></div>${ANON}`, w: el => { const l = el.querySelector('.asm .logo'); const mark = () => l.querySelectorAll('path').forEach(p => { p.style.animation = 'none'; p.getBoundingClientRect(); p.style.animation = ''; }); mark(); l.querySelectorAll('path').forEach(p => p.setAttribute('class', p.getAttribute('class'))); } },
    f08a: { t: 'Estado: link inválido', h: () => `${bar()}<div class="center"><div class="big">${ic('link')}</div><h2 class="t">Este link não funciona.</h2><p class="sub">Ele pode ter sido digitado errado ou já não existe. Peça à empresa para enviar o link de novo.</p></div><div class="spacer"></div>${ANON}` },
    f08b: { t: 'Estado: coleta encerrada', h: () => `${bar()}<div class="center"><div class="big">${ic('clock')}</div><h2 class="t">A pesquisa foi encerrada.</h2><p class="sub">O prazo para responder terminou em 30/11/2026. Obrigado a quem participou. Se ainda quiser contribuir, fale com a empresa.</p></div><div class="spacer"></div>${ANON}` },
    f08c: { t: 'Estado: já respondeu (mecânica em aberto)', h: () => `${bar()}<div class="center"><div class="big">${ic('check')}</div><h2 class="t">Esta pesquisa já foi respondida neste aparelho.</h2><p class="sub">Para manter o anonimato, só aceitamos uma resposta por aparelho. Obrigado por participar!</p><p class="fine" style="margin-top:16px">Como impedir resposta duplicada sem identificar a pessoa é uma decisão em aberto (nº 6).</p></div><div class="spacer"></div>${ANON}` }
  };
  const ORDER = ['f01', 'f02', 'f03', 'f04', 'f05', 'f06', 'f07', 'f08a', 'f08b', 'f08c'];
  const root = document.getElementById('root');
  function mount(el, id, go) { el.innerHTML = `<div class="screen">${S[id].h()}</div>`; if (S[id].w) S[id].w(el, go); el.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
    expandIcons(el); el.querySelectorAll('[data-logo]').forEach(x => x.innerHTML = window.LASTRA_LOGO && (() => { const L = LASTRA_LOGO; return `<svg viewBox="0 0 175 200" fill="currentColor" role="img" aria-label="Lastra"><path class="p1" d="${L.p1}"/><path class="p2" d="${L.p2}"/><path class="p3" d="${L.p3}"/></svg>`; })()); }
  function one(start) {
    let cur = start || 'f01';
    root.innerHTML = `<div class="one"><nav class="steps-l" aria-label="Telas do fluxo">${ORDER.map(k => `<button data-k="${k}"><span>${k.toUpperCase().replace('F08', 'F08 ')}</span><small>${S[k].t}</small></button>`).join('')}</nav><div><p class="cap"><b id="cid"></b></p><div class="phone" id="ph"></div></div>
      <aside class="notes"><div class="card"><h3>Princípios desta pesquisa</h3><p class="small muted">Anônima por desenho · só grupos com 5+ pessoas · voluntária · não é canal de denúncia · texto simples · botões grandes para o polegar.</p></div><div class="card"><h3>Decisões em aberto</h3><p class="small muted">Como evitar resposta duplicada (nº 6) · texto de apoio ao final, a validar com o psicólogo · tempo de resposta (3 minutos é estimativa).</p></div></aside></div>`;
    const ph = root.querySelector('#ph');
    function go(k) { cur = k; mount(ph, k, go); root.querySelectorAll('.steps-l button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k)); root.querySelector('#cid').textContent = k.toUpperCase().replace('F08', 'F08 ') + ' · ' + S[k].t; ph.scrollTop = 0; }
    root.querySelectorAll('.steps-l button').forEach(b => b.onclick = () => go(b.dataset.k)); go(cur);
  }
  function all() {
    root.innerHTML = `<div class="all">${ORDER.map(k => `<div><p class="cap"><b>${k.toUpperCase().replace('F08', 'F08 ')}</b> · ${S[k].t}</p><div class="phone" data-k="${k}"></div></div>`).join('')}</div>`;
    root.querySelectorAll('.phone').forEach(p => mount(p, p.dataset.k, k => { window.scrollTo({ top: 0, behavior: 'smooth' }); document.querySelector('#modo button[data-v=um]').click(); setTimeout(() => one(k), 0); }));
  }
  const btns = [...document.querySelectorAll('#modo button')];
  btns.forEach(b => b.onclick = () => { btns.forEach(x => x.setAttribute('aria-pressed', x === b)); b.dataset.v === 'um' ? one() : all(); });
  const q = new URLSearchParams(location.search); if (q.get('ver') === 'todas') btns[1].click(); else one(q.get('tela') || 'f01');
</script>
</body>
</html>

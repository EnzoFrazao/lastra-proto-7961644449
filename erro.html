<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lastra — 404, 500 e manutenção (S19) · protótipo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="assets/site.css">
<script>try{var t=localStorage.getItem('lastra-tema');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
  .err { min-height:70vh; display:grid; place-items:center; text-align:center; padding:72px 24px; }
  .err .in { max-width:560px; display:grid; gap:18px; justify-items:center; }
  .err svg.ill { width:min(340px,80vw); height:auto; color:var(--fg); }
  .lower { animation:lower 2.6s var(--ease-emph) infinite alternate; } @keyframes lower { from { transform:translateY(-22px); } to { transform:translateY(0); } }
  .previewbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; padding:20px 20px 0; font-size:13px; color:var(--fg-2); }
  .num404 { font-size:clamp(64px,12vw,120px); line-height:1; font-weight:700; letter-spacing:-.04em; color:var(--fg); }
</style>
</head>
<body data-page="erro">
<main id="conteudo">
  <div class="previewbar"><span>Ver estado:</span><div class="seg" id="st"><button data-v="404" aria-pressed="true">404 · não achamos</button><button data-v="500">500 · erro nosso</button><button data-v="manut">Manutenção</button></div></div>
  <section class="err"><div class="in" id="out"></div></section>
</main>
<script src="assets/icons.js"></script><script src="assets/site.js"></script><script src="assets/logo.js"></script><script src="assets/chrome.js"></script>
<script>
  const GROUND = '<rect x="0" y="152" width="340" height="38" fill="var(--strata-3)"/><rect x="0" y="150" width="340" height="3" fill="var(--fg)"/>';
  const SH = (kind) => `<svg class="ill" viewBox="0 0 340 190" fill="none" aria-hidden="true">${GROUND}${
    kind === '404' ? '<rect x="30" y="118" width="114" height="32" fill="currentColor"/><rect x="196" y="118" width="114" height="32" fill="currentColor"/><rect x="150" y="118" width="40" height="32" stroke="var(--fg-2)" stroke-width="2.5" stroke-dasharray="6 5"/>' :
    kind === '500' ? '<rect x="30" y="118" width="136" height="32" fill="currentColor"/><rect x="176" y="126" width="134" height="24" fill="currentColor"/><path d="M171 96v56" stroke="var(--alert)" stroke-width="5" stroke-linecap="square"/>' :
    '<rect x="60" y="118" width="220" height="32" fill="currentColor"/><rect x="90" y="84" width="160" height="30" fill="var(--fg-2)"/><g class="lower"><rect x="120" y="50" width="100" height="30" fill="var(--accent)" stroke="var(--fg)" stroke-width="2"/></g>'}</svg>`;
  const V = {
    '404': () => `${SH('404')}<p class="num404">404</p><h1 class="h2">Esta página não tem piso.</h1><p class="lead">O endereço pode ter mudado ou não existir. Vamos levar você de volta à base.</p><div class="cta-row" style="justify-content:center"><a class="btn btn-primary" href="home.html">Voltar ao início</a><a class="btn btn-secondary" href="contato.html">Falar com a Lastra</a></div>`,
    '500': () => `${SH('500')}<p class="num404">500</p><h1 class="h2">O problema foi nosso, não seu.</h1><p class="lead">Algo falhou do nosso lado. Tente de novo em instantes; se continuar, avise a equipe.</p><div class="cta-row" style="justify-content:center"><button class="btn btn-primary" onclick="location.reload()">Tentar de novo</button><a class="btn btn-secondary" href="contato.html">Avisar a equipe</a></div>`,
    'manut': () => `${SH('manut')}<h1 class="h2">Estamos nivelando o piso.</h1><p class="lead">O site está em manutenção programada e volta às 08:00. Para algo urgente, chame a gente no WhatsApp.</p><div class="cta-row" style="justify-content:center"><a class="btn btn-secondary" href="contato.html">WhatsApp</a></div>`
  };
  const b = [...document.querySelectorAll('#st button')];
  function show(v) { b.forEach(x => x.setAttribute('aria-pressed', x.dataset.v === v)); document.getElementById('out').innerHTML = V[v](); }
  b.forEach(x => x.onclick = () => show(x.dataset.v)); show(new URLSearchParams(location.search).get('estado') || '404');
</script>
</body>
</html>
